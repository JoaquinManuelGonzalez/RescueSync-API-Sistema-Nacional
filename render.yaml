# yaml-language-server: $schema=https://render.com/schema/render.yaml.json
# Render Blueprint de la API del Sistema Nacional (infraestructura como codigo).
#
# Crea y mantiene la base PostgreSQL administrada y el web service construido desde el
# Dockerfile. Toda la infraestructura de la nube se cambia editando ESTE archivo: un cambio
# hecho a mano en el dashboard que lo contradiga se pisa en el siguiente sync.
#
# Referencia de campos: https://render.com/docs/blueprint-spec
# Decision y limites del plan Free: docs/adr/ADR-002-plataforma-cloud-render.md
#
# NO contiene secretos: SECRET_KEY la genera Render y DATABASE_URL sale de la propia base.

databases:
  - name: rescuesync-sn-db
    # Explicito: si se omite, Render usa 0.1c-256mb, que es pago.
    plan: free
    # Misma region que el web service: la URL interna (red privada) solo funciona asi.
    # No se puede cambiar despues de creada.
    region: virginia
    postgresMajorVersion: "18"
    databaseName: sistema_nacional
    user: sistema_nacional
    # Lista vacia = sin acceso desde internet. Solo la alcanzan los servicios de la misma
    # region por la red privada. Para inspeccionarla desde una PC, agregar temporalmente una
    # entrada {source: <tu-ip>/32, description: ...} y sincronizar el Blueprint.
    ipAllowList: []

services:
  - type: web
    name: rescuesync-sistema-nacional
    runtime: docker
    # Explicito: si se omite, Render usa 0.5c-512mb, que es pago.
    plan: free
    region: virginia
    # Rama de la epica mientras dure; pasa a main cuando se integre (CONTRIBUTING.md seccion 8).
    branch: feat/EPIC-SN-01-dockerizacion-y-despliegue
    dockerfilePath: ./Dockerfile
    dockerContext: .
    # Solo despliega un commit si pasan TODOS los checks de GitHub Actions (.github/workflows).
    autoDeployTrigger: checksPass
    # Health check HTTP: decide cuando un deploy nuevo recibe trafico y reinicia la instancia
    # si deja de responder 2xx en menos de 5 segundos.
    healthCheckPath: /health
    # Cambios solo de documentacion no disparan build ni deploy.
    buildFilter:
      ignoredPaths:
        - docs/**
        - "**/*.md"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: rescuesync-sn-db
          property: connectionString
      # Las conexiones internas a Render Postgres soportan TLS; "require" evita que caigan a
      # texto plano.
      - key: DATABASE_SSLMODE
        value: require
      - key: SECRET_KEY
        generateValue: true
      - key: APP_ENV
        value: produccion
      - key: LOG_LEVEL
        value: INFO
      # Secretos futuros (credenciales de Bonita, claves JWT) se declaran asi, sin valor:
      #   - key: NOMBRE_DEL_SECRETO
      #     sync: false
      # Render los pide SOLO al crear el Blueprint; si se agregan despues, se cargan a mano en
      # Service -> Environment del dashboard.
